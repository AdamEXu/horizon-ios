[package]
name = "horizon-ios-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hardware keyboards and mice on iPadOS: GameController's keys and mouse, the pointer lock, the pointer's touches"
publish = false

[dependencies]
log = "0.4"
winit = "0.30.13"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
objc2-game-controller = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCDevice",
    "GCDeviceCursor",
    "GCKeyCodes",
    "GCKeyboard",
    "GCKeyboardInput",
    "GCMouse",
    "GCMouseInput",
    "GCPhysicalInputProfile",
] }

[lints]
workspace = true
