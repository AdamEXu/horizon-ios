[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon on iOS and iPadOS: the app's executable (Metal, touch controls)"
publish = false

[[bin]]
name = "horizon-ios"
path = "src/main.rs"

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-threads = { path = "../horizon-threads" }
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }

[lints]
workspace = true
